<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memorama | Rueda de la Interseccionalidad 🌸</title>
    
    <!-- Tipografía suave y redondeada -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Enlace limpio al CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Fondo Kawaii (Burbujas pastel) -->
    <div class="kawaii-background">
        <div class="bubble b-1"></div>
        <div class="bubble b-2"></div>
        <div class="bubble b-3"></div>
        <div class="bubble b-4"></div>
    </div>

    <div class="app-container">
        <header class="header">
            <!-- Enlace limpio a la imagen -->
            <img src="genero.png" alt="Banner Interseccionalidad" class="banner kawaii-shadow">
        </header>
        
        <main class="main-content kawaii-panel">
            <h1 class="kawaii-title">Memorama Interactivo</h1>
            <p class="kawaii-subtitle">¡Encuentra el par correcto entre el concepto y su ejemplo de desigualdad!</p>
            
            <!-- Contenedor fluido para las cartas -->
            <div class="memorama-tablero" id="tablero">
                <!-- Las cartas se generarán dinámicamente desde el JS -->
            </div>

            <div class="controles">
                <a href="index.html" class="btn btn-regresar"><i class="fa-solid fa-arrow-left"></i> Regresar al Menú</a>
            </div>
        </main>
    </div>

    <!-- Enlace limpio al JS -->
    <script src="main.js"></script>
</body>
</html>
