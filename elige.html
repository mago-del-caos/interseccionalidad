<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector Manual | Rueda de la Interseccionalidad</title>
    <!-- Tipografía moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <img src="genero.png" alt="Banner Rueda de la Interseccionalidad" class="banner" onerror="this.src='https://via.placeholder.com/800x200/4a148c/ffffff?text=Banner+genero.png';">
        </header>
        
        <main class="main-content glass-panel">
            <h1 class="title">Selector Manual</h1>
            <p class="subtitle">Inicia la rueda y detenla tú mismo frente a la flecha para elegir el tema a debatir.</p>
            
            <div class="ruleta-wrapper">
                <div class="flecha">▼</div>
                <canvas id="ruleta" width="400" height="400"></canvas>
            </div>

            <div class="controles">
                <button id="btn-control" class="btn">Iniciar Giro</button>
                
                <!-- Aquí aparecerá el resultado con el estilo neón -->
                <p id="resultado" class="resultado-texto"></p>
                
                <a href="index.html" class="btn btn-regresar">Regresar al Menú</a>
            </div>
        </main>
    </div>

    <!-- Archivo JS unificado -->
    <script src="main.js"></script>
</body>
</html>
