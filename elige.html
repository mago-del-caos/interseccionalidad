<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector Manual | Rueda de la Interseccionalidad 🌌</title>
    
    <!-- Tipografía ultra moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Enlace limpio al CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="animated-background">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <div class="app-container">
        <header class="header floating">
            <!-- Enlace limpio a la imagen -->
            <img src="genero.png" alt="Banner Interseccionalidad" class="banner neon-border">
        </header>
        
        <main class="main-content glass-panel-neon">
            <h1 class="title glitch-effect" data-text="Selector Manual">Selector Manual</h1>
            <p class="subtitle typing-effect">Inicia la rueda y detenla tú mismo frente a la flecha para elegir el tema a debatir.</p>
            
            <div class="ruleta-wrapper">
                <div class="flecha"><i class="fa-solid fa-caret-down"></i></div>
                <canvas id="ruleta" width="400" height="400"></canvas>
            </div>

            <div class="controles">
                <button id="btn-control" class="btn"><i class="fa-solid fa-play"></i> Iniciar Giro</button>
                
                <!-- Aquí aparecerá el resultado con el estilo neón -->
                <p id="resultado" class="resultado-texto"></p>
                
                <!-- Enlace limpio de regreso -->
                <a href="index.html" class="btn btn-regresar"><i class="fa-solid fa-arrow-left"></i> Regresar al Menú</a>
            </div>
        </main>
    </div>

    <!-- Enlace limpio al JS -->
    <script src="main.js"></script>
</body>
</html>
