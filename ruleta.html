<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruleta de Azar | Rueda de la Interseccionalidad 🌸</title>
    
    <!-- Tipografía suave y redondeada -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Enlace limpio al CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Librería para el efecto de confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <!-- Fondo Kawaii (Burbujas pastel) -->
    <div class="kawaii-background">
        <div class="bubble b-1"></div>
        <div class="bubble b-2"></div>
        <div class="bubble b-3"></div>
        <div class="bubble b-4"></div>
    </div>

    <div class="app-container">
        <header class="header">
            <!-- Enlace limpio a la imagen -->
            <img src="genero.png" alt="Banner Interseccionalidad" class="banner kawaii-shadow">
        </header>
        
        <main class="main-content kawaii-panel">
            <h1 class="kawaii-title">Ruleta de Azar</h1>
            <p class="kawaii-subtitle">Ajusta la fuerza y descubre un elemento de desigualdad.</p>
            
            <div class="ruleta-wrapper">
                <div class="flecha"><i class="fa-solid fa-caret-down"></i></div>
                <!-- El tamaño del canvas ahora es controlado dinámicamente por el CSS -->
                <canvas id="ruleta" width="400" height="400"></canvas>
            </div>

            <div class="controles">
                <label for="fuerza" style="font-weight: 900; font-size: 1.1rem; color: var(--pastel-morado);">NIVEL DE FUERZA:</label>
                <input type="range" id="fuerza" min="1" max="10" value="5">
                
                <button id="btn-girar" class="btn"><i class="fa-solid fa-bolt"></i> ¡Girar Ruleta!</button>
                <a href="index.html" class="btn btn-regresar"><i class="fa-solid fa-arrow-left"></i> Regresar al Menú</a>
            </div>
        </main>
    </div>

    <!-- Enlace limpio al JS -->
    <script src="main.js"></script>
</body>
</html>
