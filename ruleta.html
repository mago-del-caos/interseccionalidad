<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta con Fuerza | Rueda de la Interseccionalidad</title>
    <!-- Tipografía moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Librería para el efecto de confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <img src="genero.png" alt="Banner Rueda de la Interseccionalidad" class="banner" onerror="this.src='https://via.placeholder.com/800x200/4a148c/ffffff?text=Banner+genero.png';">
        </header>
        
        <main class="main-content glass-panel">
            <h1 class="title">Ruleta de Azar</h1>
            <p class="subtitle">Ajusta la fuerza de tu lanzamiento y gira la rueda para descubrir un elemento.</p>
            
            <div class="ruleta-wrapper">
                <div class="flecha">▼</div>
                <canvas id="ruleta" width="400" height="400"></canvas>
            </div>

            <div class="controles">
                <label for="fuerza" style="font-weight: 600; font-size: 1.1rem;">Nivel de fuerza:</label>
                <input type="range" id="fuerza" min="1" max="10" value="5">
                
                <button id="btn-girar" class="btn">¡Girar Ruleta!</button>
                <a href="index.html" class="btn btn-regresar">Regresar al Menú</a>
            </div>
        </main>
    </div>

    <!-- Archivo JS unificado -->
    <script src="main.js"></script>
</body>
</html>
